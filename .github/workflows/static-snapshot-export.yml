name: Probe OpenAQ air quality

on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: App branch or commit containing the diagnostics
        required: true
        default: main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the private app repository
        uses: actions/checkout@v4
        with:
          repository: mtekie/dashboard-et
          ref: ${{ inputs.app_ref }}
          ssh-key: ${{ secrets.APP_REPO_DEPLOY_KEY }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Diagnose eligible stations without writing artifacts
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: node scripts/capture-air-quality.mjs --diagnostics | tee openaq-diagnostics.txt

      - name: Summarize OpenAQ diagnostics
        if: always()
        run: |
          {
            echo "## OpenAQ read-only probe"
            echo '```text'
            if [ -f openaq-diagnostics.txt ]; then cat openaq-diagnostics.txt; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
