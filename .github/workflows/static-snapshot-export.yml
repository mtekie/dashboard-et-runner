name: Static snapshot export

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: static-snapshot-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      DASHBOARD_MUSE_TOKEN: ${{ secrets.DASHBOARD_MUSE_TOKEN }}
    steps:
      - name: Check out the private app repository
        uses: actions/checkout@v4
        with:
          repository: mtekie/dashboard-et
          ref: main
          ssh-key: ${{ secrets.APP_REPO_DEPLOY_KEY }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export static snapshot artifacts
        run: pnpm run ingest -- --due-only

      - name: Refresh ESX Market Lab data
        run: pnpm run capture:esx-lab

      - name: Refresh World Bank commodity benchmarks
        continue-on-error: true
        run: pnpm run capture:commodities

      - name: Install PDF text extraction for official CPI releases
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils

      - name: Refresh energy, official fuel, food and CPI prices
        continue-on-error: true
        run: pnpm run capture:business-prices

      - name: Validate exported snapshot
        run: pnpm run test:ingest

      - name: Commit exported snapshot
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Refresh static snapshot export"
          file_pattern: "public/data/live_events.json ops/source_health.json public/data/market_indicators.json public/data/indicator_history.json public/data/daily_brief.json public/data/scheduled_tasks.json public/data/esx_lab.json public/data/commodities.json public/data/energy-prices.json public/data/fuel-prices.json public/data/food-prices.json public/data/cpi-prices.json"

      - name: Fail when the ESX Market Lab snapshot is stale
        run: pnpm run check:esx-lab

      - name: Check the monthly commodity release
        if: always()
        run: pnpm run check:commodities

      - name: Check business price observations after publication
        if: always()
        run: pnpm run check:business-prices
